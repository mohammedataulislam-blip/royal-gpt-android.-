name: Build ROYAL GPT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'royal-gpt.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q royal-gpt.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '1
                
                - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          gradle -p project --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROYAL-GPT-APK
          path: project/app/build/outputs/apk/debug/*.apk
          
